<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Remix: ProDent</title>
    <meta name="description" content="نظام شامل لإدارة عيادات الأسنان." />
    <meta property="og:title" content="Remix: ProDent" />
    <meta property="og:description" content="نظام شامل لإدارة عيادات الأسنان." />
    <meta property="og:type" content="website" />
    
    <!-- PWA & Mobile Web App Meta -->
    <meta name="theme-color" content="#5a55d2" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="ProDent" />
    
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="shortcut icon" href="/favicon.ico" />

    <!-- Instant Dark Mode Init Script (Prevents flash of white) -->
    <script>
      (function() {
        try {
          var savedTheme = localStorage.getItem('@prodent_theme_v1');
          if (savedTheme === 'dark') {
            document.documentElement.classList.add('dark');
          } else if (savedTheme === 'light') {
            document.documentElement.classList.remove('dark');
          } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-[#f8f9fc] dark:bg-gray-900 text-gray-900 dark:text-gray-100 antialiased selection:bg-indigo-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
